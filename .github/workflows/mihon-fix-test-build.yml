name: Mihon Fix Signed Test Build

on:
  push:
    branches:
      - fix/mihon-uncaught-exception-interceptor
  pull_request:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihon-fix-signed-test-build
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Mihon compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Mihon regression tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests "io.github.landwarderer.futon.mihon.compat.MihonNetworkHelperTest"
          --stacktrace
          --no-build-cache
          --no-configuration-cache

      - name: Run release lint (diagnostic)
        id: release-lint
        continue-on-error: true
        run: >-
          ./gradlew lintRelease
          --stacktrace
          --no-build-cache
          --no-configuration-cache

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Futon-Mihon-Fix-Lint-Diagnostics
          path: |
            app/build/reports/lint-results-release.html
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Report legacy lint status
        if: steps.release-lint.outcome == 'failure'
        run: echo "Release lint reported existing project-wide findings; scoped Mihon regression tests passed, so the test APK build will continue."

  signed-release:
    name: Build signed optimized test APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_FILE secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS secret is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is missing"; exit 1; }

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          test -s "$GITHUB_WORKSPACE/keystore.jks"

      - name: Build signed optimized release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: >-
          ./gradlew assembleRelease
          -PversionName=9.8.1-mihon-fix-test
          -PversionCode=90802
          --stacktrace
          --no-build-cache
          --no-configuration-cache

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare test artifact
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/test-artifact"
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" \
             "$GITHUB_WORKSPACE/test-artifact/Futon-9.8.1-mihon-fix-test-signed-release.apk"
          cd "$GITHUB_WORKSPACE/test-artifact"
          sha256sum Futon-9.8.1-mihon-fix-test-signed-release.apk > Futon-9.8.1-mihon-fix-test-signed-release.apk.sha256

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: Futon-Mihon-Fix-Signed-Release
          path: test-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/keystore.jks"

  report:
    name: Record test build status
    if: always()
    needs:
      - verify
      - signed-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/mihon-uncaught-exception-interceptor

      - name: Write run status
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SIGNED_RESULT: ${{ needs.signed-release.result }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat > .ci/mihon-fix-latest.json <<EOF
          {
            "run_id": "$RUN_ID",
            "source_sha": "$SOURCE_SHA",
            "verify": "$VERIFY_RESULT",
            "signed_release": "$SIGNED_RESULT"
          }
          EOF

      - name: Commit run status
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/mihon-fix-latest.json
          git commit -m "ci: record Mihon test build status [skip ci]" || exit 0
          git push origin HEAD:fix/mihon-uncaught-exception-interceptor
