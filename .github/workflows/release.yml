name: Release Build

on:
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            VERSION="${GITHUB_REF#refs/heads/release/v}"
            RELEASE_TAG="v$VERSION"
          else
            echo "::error::Unsupported release ref: $GITHUB_REF"
            exit 1
          fi

          SOURCE_VERSION="$(grep -E '^versionName=' gradle.properties | tail -n 1 | cut -d= -f2-)"
          SOURCE_CODE="$(grep -E '^versionCode=' gradle.properties | tail -n 1 | cut -d= -f2-)"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use MAJOR.MINOR.PATCH, got: $VERSION"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::gradle.properties versionName ($SOURCE_VERSION) does not match release ($VERSION)"
            exit 1
          fi
          if [ "$SOURCE_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::gradle.properties versionCode ($SOURCE_CODE) does not match expected code ($EXPECTED_CODE)"
            exit 1
          fi
          if [ ! -f "docs/releases/$VERSION.md" ]; then
            echo "::error::Missing release notes: docs/releases/$VERSION.md"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$EXPECTED_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Release identity: $RELEASE_TAG, $VERSION ($EXPECTED_CODE)"

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Repository release signing configuration is present."

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Mihon regression tests
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*minSdk = 26$' app/build.gradle
          ./gradlew testDebugUnitTest \
            --tests "io.github.landwarderer.futon.mihon.ExtensionRepoServiceTest" \
            --tests "io.github.landwarderer.futon.mihon.TachiyomiApkClassLoaderPolicyTest" \
            --tests "io.github.landwarderer.futon.mihon.compat.MihonNetworkHelperTest" \
            --tests "io.github.landwarderer.futon.mihon.compat.MihonSourceApiCompatTest" \
            --tests "io.github.landwarderer.futon.mihon.compat.MihonModernHostContractTest" \
            --tests "io.github.landwarderer.futon.mihon.MihonMangaRepositoryTest" \
            --tests "io.github.landwarderer.futon.mihon.state.MihonSnapshotPersistenceTest" \
            --tests "io.github.landwarderer.futon.mihon.model.MihonDataConvertersTest" \
            --tests "io.github.landwarderer.futon.core.network.GitHubRawUrlCompatTest" \
            --stacktrace \
            --no-build-cache \
            --no-configuration-cache

      - name: Run release lint
        run: >-
          ./gradlew lintRelease
          --stacktrace
          --no-build-cache
          --no-configuration-cache

      - name: Build signed optimized release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: >-
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ steps.version.outputs.version_code }}
          --stacktrace
          --no-build-cache
          --no-configuration-cache

      - name: Verify optimized Mihon runtime ABI
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          rm -rf "$RUNNER_TEMP/futon-release-dex"
          mkdir -p "$RUNNER_TEMP/futon-release-dex"
          unzip -q "$APK" 'classes*.dex' -d "$RUNNER_TEMP/futon-release-dex"
          cat "$RUNNER_TEMP"/futon-release-dex/classes*.dex | strings > "$RUNNER_TEMP/futon-release-dex/strings.txt"
          DEX_STRINGS="$RUNNER_TEMP/futon-release-dex/strings.txt"

          require_dex_string() {
            local symbol="$1"
            if ! grep -Fq "$symbol" "$DEX_STRINGS"; then
              echo "::error::Optimized APK is missing required Mihon ABI symbol: $symbol"
              exit 1
            fi
          }

          for symbol in \
            'com/squareup/zstd/ZstdCompressor' \
            'androidx/preference/PreferenceScreen' \
            'eu/kanade/tachiyomi/source/ConfigurableSource' \
            'eu/kanade/tachiyomi/source/Source' \
            'eu/kanade/tachiyomi/source/model/RefreshContext' \
            'eu/kanade/tachiyomi/source/online/HttpSource' \
            'eu/kanade/tachiyomi/source/model/SManga' \
            'eu/kanade/tachiyomi/source/model/SChapter' \
            'eu/kanade/tachiyomi/source/model/SMangaUpdate' \
            'eu/kanade/tachiyomi/source/model/Page' \
            'getMangaUpdate' \
            'fetchRelatedMangaList' \
            'getChapterList' \
            'getPageList' \
            'fetchPageList' \
            'CaptchaAutoResolveCoordinator' \
            'TachiyomiApkClassLoaderPolicy' \
            'org/brotli/dec/BrotliInputStream'; do
            require_dex_string "$symbol"
          done

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<< "$BADGING"
          grep -Fq "versionName='$VERSION'" <<< "$BADGING"

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          OUT="$GITHUB_WORKSPACE/release-artifact"
          APK_NAME="Futon-$VERSION.apk"
          mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" "$OUT/$APK_NAME"
          cd "$OUT"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          {
            echo "Futon $VERSION"
            echo "Version code: $VERSION_CODE"
            echo "Source commit: $GITHUB_SHA"
            echo "Signing: repository-release-key"
            echo "Build: optimized release (R8 minify + resource shrinking)"
          } > BUILD-INFO.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Futon ${{ steps.version.outputs.version }}
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifact/Futon-${{ steps.version.outputs.version }}.apk
            release-artifact/Futon-${{ steps.version.outputs.version }}.apk.sha256
            release-artifact/BUILD-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord - Release published
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILD }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.release_tag }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          payload=$(jq -n --arg content "Release published: ${{ steps.version.outputs.release_tag }}\n$RELEASE_URL" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" || true

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks

      - name: Notify Discord - Release failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BUILD }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          payload=$(jq -n --arg content "Release failed for $GITHUB_REF\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" || true
