    type: instruction
    rule: "If Futon fails a Mihon/Keiyoushi behavior and Kototoro has a demonstrated working equivalent, port the relevant Kototoro implementation as literally as practical, adapting only required integration boundaries, port tests, preserve Apache-2.0 attribution, and record exact source path + SHA."

  FAILURE_CLASSLOADER_FAMILY:
    type: trigger
    patterns:
      - AbstractMethodError
      - NoSuchMethodError
      - IncompatibleClassChangeError
      - ClassCastException
      - VerifyError
      - duplicate_API_class_identity
      - classloader_specific_ClassNotFoundException
