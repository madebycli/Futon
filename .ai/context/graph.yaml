      - app/src/main/kotlin/io/github/landwarderer/futon/mihon/ChildFirstClassLoaderPolicy.kt
      - app/src/main/kotlin/io/github/landwarderer/futon/mihon/extensions/runtime/tachiyomi/TachiyomiApkClassLoaderPolicy.kt
    implementation: "DexClassLoader plus explicit host-owned Tachiyomi ABI delegation."
    parent_owned_namespaces:
      - java
      - javax
      - kotlin
      - kotlinx.coroutines
      - android
      - androidx
      - org.json
      - org.jsoup
      - okhttp3
      - okio
      - rx
      - eu.kanade.tachiyomi.source
      - eu.kanade.tachiyomi.network
      - eu.kanade.tachiyomi.util
      - uy.kohesive.injekt
      - ireader.core
      - io.ktor
      - com.fleeksoft
    child_first_bridge_exceptions:
      - "$-CC"
      - "$DefaultImpls"
    regression_test: TachiyomiApkClassLoaderPolicyTest

