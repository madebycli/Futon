  FIX_PERSISTED_SNAPSHOTS:
    type: fix
    status: implemented_tested_and_optimized_apk_verified
    responsibility: "Preserve host-owned Mihon manga/chapter state across app process restart and allow restored DB content to resolve after asynchronous extension loading."
    files:
      - app/src/main/kotlin/io/github/landwarderer/futon/mihon/state/MihonSnapshotPersistence.kt
      - app/src/main/kotlin/io/github/landwarderer/futon/core/parser/AwaitingMihonMangaRepository.kt
      - app/src/main/kotlin/io/github/landwarderer/futon/core/parser/MangaRepository.kt
      - app/src/main/kotlin/io/github/landwarderer/futon/mihon/MihonExtensionManager.kt
      - app/src/main/kotlin/io/github/landwarderer/futon/mihon/extensions/runtime/ExternalExtensionManagerFacade.kt
      - app/src/main/kotlin/io/github/landwarderer/futon/mihon/extensions/runtime/ExternalExtensionManagerRuntime.kt
      - app/src/main/kotlin/io/github/landwarderer/futon/mihon/MihonMangaRepository.kt
      - app/src/test/kotlin/io/github/landwarderer/futon/mihon/state/MihonSnapshotPersistenceTest.kt
    disk_file: mihon-model-snapshots-v1.json
    location: noBackupFilesDir
    schema_version: 1
    max_manga_entries: 500
    max_chapter_entries: 1000
    key: "sourceId + exact URL"
    url_normalization: false
    extension_implementation_objects_serialized: false
    synchronized: true
    fsync_before_replace: true
    atomic_replace_when_supported: true
    corrupt_file_behavior: cache_miss_and_recoverable
    unsupported_schema_behavior: ignored_cache_miss
    initial_extension_readiness_wait: true
    initial_load_signal_completed_in_finally: true

  FIX_RESTORE_FIELD_FIDELITY:
    type: fix
    status: implemented_and_regression_tested
    commit: 809a8900f9f662b516b61eb7443cbf6c78021e6a
    root_cause: "Modern model setters can mutate independently persisted legacy fields during restore."
    restore_order_rules:
      - set_SManga_genres_then_reapply_genre
      - set_SChapter_number_then_reapply_chapter_number
      - set_SChapter_scanlators_then_reapply_scanlator
    strict_fixture_head: 78d128189277167cd2f0c84979c9f94139b9ff05

  PERSISTENCE_TESTS:
    type: regression_suite
    class: io.github.landwarderer.futon.mihon.state.MihonSnapshotPersistenceTest
    included_in_ci: true
    coverage:
      - store_recreation_models_process_restart
      - legacy_and_modern_field_fidelity
      - source_id_isolation_for_identical_urls
      - corrupt_file_fallback_and_recovery
      - unsupported_schema_fallback

  FIX_SHARED_CHAPTER_SNAPSHOT:
    type: historical_current_fix
    status: implemented_and_retained
    root_cause: repository_instance_local_chapter_snapshot_loss
    key: "sourceId + exact chapter URL"
    process_local: true
    note: "Still useful inside a process; durable persistence now also covers restart."

  FIX_DEFAULT_CLIENT:
    type: fix
    status: implemented_and_tested
    interceptor_order:
      - UncaughtExceptionInterceptor
      - UserAgentInterceptor
      - CloudflareInterceptor
    preserves_full_base_client_configuration: true
    rebuilds_only_interceptor_lists: true

  FIX_BROTLI_ZSTD_RUNTIME:
    type: fix
    status: implemented_tested_and_dex_verified
    modern_default_client_excludes_incompatible_compression_interceptors: true
    legacy_compatibility_retained: true

  FIX_SOURCE_API_16:
    type: fix
    status: implemented_tested_and_dex_verified
    includes:
      - Source_getPopularManga
      - Source_getLatestUpdates
      - Source_getSearchManga
      - Source_getFilterList
      - Source_getMangaUpdate
      - Source_getPageList
      - HttpSource_getHomeUrl
      - HttpSource_getImageUrl
      - SManga_memo
      - SChapter_memo
      - legacy_Rx_fallback

  FIX_API26:
    type: fix
    status: implemented_and_tested
    from_min_sdk: 23
    to_min_sdk: 26
    reason: "Prevent dynamic extension serializer/default-method desugaring ABI mismatch."

  FIX_CLASSLOADER_POLICY:
    type: fix
    status: implemented_tested_and_dex_verified
    implementation: TachiyomiApkClassLoaderPolicy
    host_owned_abi: true
    child_first_bridge_exceptions:
      - "$-CC"
      - "$DefaultImpls"

  FIX_CLOUDFLARE:
    type: fix
    status: historical_device_proven_and_retained
    strategy: "WebView solve, changed clearance detection, retry original source request."
    historical_proven_source: Comix
    historical_result: HTTP_200_after_retry

  KOTOTORO_CLOUDFLARE_PARITY:
