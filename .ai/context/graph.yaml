    root_cause: "Centralized compression filtering lost compatibility with a legacy/fork test interceptor named BrotliInterceptor."
    fix: "Restore simple-name BrotliInterceptor filter in addition to concrete OkHttp singleton filtering."

  CI_FAILURE_86F:
    type: historical_regression
    source_sha: 86f6acd280fa79591249cebb9dce7a9649f78edd
    status: resolved
    root_cause: "Construction-time android.util.Log.d calls in interceptor filtering throw RuntimeException in plain JVM Android stubs; both red tests shared this one cause."
    fix: "Remove nonessential construction-time skip logs without changing runtime filtering behavior."
    resolved_by_source_sha: 157d94e249e2cc06b86b2088f9616802575efa5f

